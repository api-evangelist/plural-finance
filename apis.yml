name: Plural Finance
description: 'Plural Finance is a financial operating system for infrastructure — a programmable
  execution layer that automates ownership, payments, compliance, and reporting across the
  lifecycle of infrastructure and energy assets. Its AssetOS platform tokenizes infrastructure
  assets such as distributed renewables, data centers, public-private partnerships, and
  electricity sales contracts, so institutional and individual investors can underwrite,
  monitor, and trade projects, with smart-contract execution of capital contributions and
  distributions and embedded regulatory controls. The company holds broker-dealer licensing
  and is backed by Paradigm. Plural currently exposes no public developer API, SDK, or
  documentation surface; access is through its institutional web application.'
